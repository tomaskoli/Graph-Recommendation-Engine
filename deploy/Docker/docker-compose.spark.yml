name: devnet-spark

services:
  spark:
    image: apache/spark:4.1.3-scala2.13-java17-python3-r-ubuntu
    working_dir: /workspace
    volumes:
      - ../../spark:/workspace/spark
      - ../../data:/workspace/data
    command: ["/opt/spark/bin/spark-submit", "spark/copurchase_lift.py"]
    networks:
      - devnet

networks:
  devnet:
    external: true
